# Agendador das notificações (11.5): chama o app a cada poucos minutos para ele decidir quais avisos enviar.
# Precisa de dois "secrets" no repositório (Settings > Secrets and variables > Actions):
#   MKI_URL      endereço do app, por exemplo https://seu-app.vercel.app
#   CRON_SECRET  o mesmo valor da variável CRON_SECRET na Vercel
# O GitHub pode atrasar execuções agendadas em alguns minutos; é normal. Alternativa: cron-job.org chamando a mesma URL.
name: notificacoes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir os avisos devidos
        env:
          MKI_URL: ${{ secrets.MKI_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MKI_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Faltam os secrets MKI_URL e CRON_SECRET"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${MKI_URL%/}/api/cron/notify"
